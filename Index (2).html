<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pawn Storm Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c2350;--surface:#2a3470;--line:#4352a0;--text:#ffffff;--muted:#c3ccf5;--accent:#ffc83d;--on:#1c2350;--ok:#5fe0a0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f8ff;--surface:#dfe8ff;--line:#b6c6f5;--text:#16204a;--muted:#4a5688;--accent:#5b3fe8;--on:#fff;--ok:#12864f}}
:root[data-theme="light"]{--bg:#f6f8ff;--surface:#dfe8ff;--line:#b6c6f5;--text:#16204a;--muted:#4a5688;--accent:#5b3fe8;--on:#fff;--ok:#12864f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.55 "Work Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Spectral,Georgia,serif;line-height:1.15;margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 1.25rem}
.top{border-bottom:1px solid var(--line)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem}
.brand{font:700 1.2rem Spectral,serif}
nav a{margin-left:1.2rem;color:var(--muted);padding-bottom:.2rem}
nav a.on{color:var(--text);border-bottom:2px solid var(--accent)}
.hero{padding:3rem 0 2rem}
.hero h1{font-size:clamp(2.2rem,6vw,3.8rem);max-width:16ch}
.hero p{color:var(--muted);max-width:44ch;font-size:1.1rem}
h2{font-size:1.7rem;margin:2rem 0 1rem}
h3{font-size:1.2rem}
.btn{background:var(--accent);color:var(--on);border:0;border-radius:4px;padding:.6rem 1.1rem;font:600 .95rem "Work Sans",sans-serif;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--muted)}
.btn.sm{padding:.3rem .7rem;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ev{display:grid;grid-template-columns:130px 1fr auto;gap:1rem;align-items:center;padding:1.1rem 0;border-top:1px solid var(--line)}
.ev .date{font-weight:600}
.ev p{margin:.2rem 0 0;color:var(--muted);font-size:.95rem}
.acts{display:flex;gap:.5rem}
.panel{background:var(--surface);border-radius:6px;padding:1.2rem;margin:1rem 0}
.row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:end}
label{display:grid;gap:.25rem;font-weight:500;font-size:.9rem}
input,select{font:inherit;padding:.5rem .6rem;border-radius:4px;border:1px solid var(--muted);background:var(--bg);color:var(--text);min-width:0}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.55rem .5rem;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:.9rem}
.badge{display:inline-block;background:var(--accent);color:var(--on);font-weight:600;font-size:.8rem;padding:.1rem .5rem;border-radius:3px;margin-left:.5rem;vertical-align:middle}
.muted{color:var(--muted)}
.pend{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:.6rem 1rem;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:1.4rem;width:min(92vw,380px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog form{display:grid;gap:.9rem}
a.btn{display:inline-block}#loginf{display:grid;gap:1rem;max-width:420px}nav .lk{background:none;border:0;color:var(--muted);font:inherit;margin-left:1.2rem;cursor:pointer;padding:0 0 .2rem}nav .lk:hover{color:var(--text)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.grid2>div{grid-column:1/-1}footer a{text-decoration:underline}.steps,.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin:1rem 0}.steps div,.facts div{background:var(--surface);border-radius:6px;padding:1rem}.steps b{display:block;font:700 1.1rem Spectral,serif;color:var(--accent);margin-bottom:.2rem}.facts b{display:block;font:700 1.6rem Spectral,serif}.facts span{color:var(--muted);font-size:.9rem}.dh{padding:1rem 0 1.25rem}.dh h1{font-size:clamp(2rem,5vw,3rem)}.btn.big{padding:.9rem 1.6rem;font-size:1.05rem;margin:.75rem 0 .4rem}.sm{font-size:.88rem;margin:0}footer{padding:2rem 0 3rem;margin-top:2rem;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
@media (max-width:680px){.grid2{grid-template-columns:1fr}.steps,.facts{grid-template-columns:1fr}.ev{grid-template-columns:1fr}.bar{flex-wrap:wrap;gap:.5rem}}
</style>
</head>
<body>
<header class="top"><div class="bar"><a class="brand" href="#events">♞ Pawn Storm Arena</a><nav id="nav"></nav></div></header>
<main class="wrap" id="app"></main>
<footer class="wrap">Pawn Storm Arena. This is a preview: tournament data is saved in this browser only. </footer>

<dialog id="reg"><form id="regf"><h3 id="regt">Register</h3>
<label>Player name<input name="n" required autocomplete="off"></label>
<label>Rating (0 if unrated)<input name="r" type="number" min="0" max="3000" value="0" required></label>
<div class="row"><button class="btn" type="submit">Register player</button><button class="btn ghost" type="button" id="regx">Cancel</button></div></form></dialog>
<div id="toast" role="status"></div>

<script>
(function(){
var S=null;
try{S=JSON.parse(localStorage.getItem('dkc-platform'))}catch(e){}
if(!S||!S.ev){S={td:'Tournament Director',cur:'e1',ev:[
{id:'e1',name:'John H Shary Elementary Tournament',date:'2026-12-05',venue:'Mission, TX',rounds:4,players:[],rd:[]},
{id:'e2',name:'Dr Carlos E Castaneda Elementary Tournament',date:'2026-12-12',venue:'McAllen, TX',rounds:4,players:[],rd:[]},
{id:'e3',name:'De Zavala Elementary Tournament',date:'2027-01-09',venue:'Edinburg, TX',rounds:4,players:[],rd:[]}]}}
var ref=null,canWrite=false,busy=false,again=false,mailto=null;
function save(){try{localStorage.setItem('dkc-platform',JSON.stringify(S))}catch(e){}push()}
function push(){if(!ref||!canWrite)return;if(busy){again=true;return}busy=true;ref.set({ev:JSON.parse(JSON.stringify(S.ev))}).catch(function(){toast('Could not save to the shared database.')}).then(function(){busy=false;if(again){again=false;push()}})}
async function syncDb(){
 try{
  var c=window.claude;if(!c||!c.use)return;
  var d=await c.use('db');if(!d)return;
  var u=await c.use('user');
  try{canWrite=u?!!(await u.canEdit()):false}catch(e){canWrite=false}
  ref=d.doc('psa/state');
  var t=setTimeout(function(){toast('Shared tournament data cannot be reached yet.')},10000);
  ref.onSnapshot(function(s){
   clearTimeout(t);
   if(s.metadata.hasPendingWrites)return;
   if(s.exists&&s.data().ev){
    var nev=JSON.parse(JSON.stringify(s.data().ev));
    if(JSON.stringify(nev)!==JSON.stringify(S.ev)){S.ev=nev;if(!ev(S.cur)&&nev.length)S.cur=nev[0].id;try{localStorage.setItem('dkc-platform',JSON.stringify(S))}catch(e){}render()}
   }else if(canWrite){push()}
  },function(){clearTimeout(t)});
  render();
 }catch(e){}
}
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uid(){return 'x'+Math.random().toString(36).slice(2,9)}
function cur(){return S.ev.find(function(e){return e.id===S.cur})||S.ev[0]}
function ev(id){return S.ev.find(function(e){return e.id===id})}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show')},2400)}
function pname(e,id){var p=e.players.find(function(x){return x.id===id});return p?p.name:'?'}

/* scoring */
function pt(g,id){if(!g.r)return 0;if(g.r==='.5')return .5;if(g.w===id)return g.r==='1-0'?1:0;return g.r==='0-1'?1:0}
function score(e,id){var s=0;e.rd.forEach(function(r){r.forEach(function(g){if(g.w===id||g.b===id)s+=pt(g,id)})});return s}
function standings(e){
 var rows=e.players.map(function(p){var bu=0;e.rd.forEach(function(r){r.forEach(function(g){if(g.b!==null&&(g.w===p.id||g.b===p.id)){bu+=score(e,g.w===p.id?g.b:g.w)}})});return{p:p,pts:score(e,p.id),bu:bu}});
 rows.sort(function(a,b){return b.pts-a.pts||b.bu-a.bu||b.p.rtg-a.p.rtg});return rows}
function roundDone(e){if(!e.rd.length)return true;return e.rd[e.rd.length-1].every(function(g){return g.r})}

/* Swiss pairing */
function pairRound(e){
 var played={},blk={},hadBye={},sc={};
 e.players.forEach(function(p){played[p.id]={};blk[p.id]=0;sc[p.id]=score(e,p.id)});
 e.rd.forEach(function(r){r.forEach(function(g){if(g.b===null){hadBye[g.w]=1}else{played[g.w][g.b]=1;played[g.b][g.w]=1;blk[g.b]++;blk[g.w]--}})});
 var list=e.players.slice();
 if(!e.rd.length){list.sort(function(a,b){return b.rtg-a.rtg})}
 else{list.sort(function(a,b){return sc[b.id]-sc[a.id]||b.rtg-a.rtg})}
 var bye=null;
 if(list.length%2){for(var i=list.length-1;i>=0;i--){if(!hadBye[list[i].id]){bye=list.splice(i,1)[0];break}}
  if(!bye)bye=list.pop()}
 var pairs=[];
 if(!e.rd.length){var h=list.length/2;for(var k=0;k<h;k++)pairs.push(k%2?[list[k+h],list[k]]:[list[k],list[k+h]])}
 else{
  var go=function(l,rep){if(!l.length)return[];var a=l[0];
   for(var i=1;i<l.length;i++){var b=l[i];if(!rep&&played[a.id][b.id])continue;
    var m=go(l.filter(function(x,j){return j&&j!==i}),rep);
    if(m){var d=blk[a.id]-blk[b.id];var bd=m.length;
     var wb=d>0?[a,b]:d<0?[b,a]:(bd%2?[a,b]:[b,a]);return[wb].concat(m)}}
   return null};
  pairs=go(list,false)||go(list,true)||[]}
 var rd=pairs.map(function(p){return{w:p[0].id,b:p[1].id,r:''}});
 if(bye)rd.push({w:bye.id,b:null,r:'1-0'});
 e.rd.push(rd)}

/* views */
function vEvents(){
 var h='<section class="hero"><h1>Every great game starts with the first move.</h1><p>Pick your tournament, take your seat, and watch the standings change after every round.</p></section><div class="steps"><div><b>1. Pick</b>Choose a tournament below and open its page.</div><div><b>2. Register</b>Fill out the short registration form.</div><div><b>3. Play</b>Check pairings and standings here on game day.</div></div><h2>Upcoming tournaments</h2>';
 S.ev.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(e){
  h+='<article class="ev"><div class="date">'+fmt(e.date)+'</div><div><h3>'+esc(e.name)+'</h3><p>'+esc(e.venue)+', '+e.rounds+' rounds, '+e.players.length+' registered'+(e.rd.length?', round '+e.rd.length+' in progress':'')+'</p></div><div class="acts"><a class="btn" href="#e-'+e.id+'">View details</a></div></article>'});
 return h}

var TD='arjkrish29@gmail.com';
function isTD(){return !!S.user&&S.user===TD}
function hashPw(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode('psa:'+s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}
function vLocked(){return'<section class="dh"><h1>Directors only</h1><p class="muted">Log in with the tournament director account to open the TD console.</p><a class="btn" href="#login">Log in</a></section>'}
function vLogin(){
 if(S.user){return'<section class="dh"><h1>You are logged in</h1><p class="muted">'+esc(S.user)+(isTD()?' (tournament director)':'')+'</p>'+(isTD()?'<a class="btn" href="#manage">Open the TD console</a>':'<a class="btn" href="#events">Browse tournaments</a>')+'</section>'}
 return'<section class="dh"><h1>Log in</h1><p class="muted">Players can enter an email to speed up registration. Tournament directors log in with the director email and password. The first time, the password you enter (8 or more characters) becomes your password.</p></section><form id="loginf" class="panel"><label>Email<input name="e" type="email" required autocomplete="email"></label><label>Password (directors)<input name="p" type="password" autocomplete="current-password"></label><button class="btn" type="submit">Log in</button>'+(S.pw?'<button class="btn ghost" type="button" data-resetpw="1">Forgot password? Reset it on this device</button>':'')+'</form>'}
function regForm(e){if(e.rd.length)return'';return'<section class="panel" id="regbox" hidden><h2 style="margin-top:0">Register for '+esc(e.name)+'</h2><form id="regf2" class="grid2" data-ev="'+e.id+'"><label>Player name<input name="n" required autocomplete="off"></label><label>Rating (0 if unrated)<input name="r" type="number" min="0" max="3000" value="0" required></label><label>Grade<input name="g" placeholder="For example, 3rd"></label><label>School or club<input name="s" autocomplete="organization"></label><label>Parent or guardian name<input name="p" required autocomplete="name"></label><label>Email<input name="m" type="email" required autocomplete="email" value="'+esc(S.user||'')+'"></label><label>Phone (optional)<input name="t" type="tel" autocomplete="tel"></label><div class="row"><button class="btn" type="submit">Submit registration</button><button class="btn ghost" type="button" data-hidereg="1">Cancel</button></div></form></section>'}
function rtext(g){return g.b===null?'Bye':g.r==='1-0'?'1-0':g.r==='.5'?'½-½':g.r==='0-1'?'0-1':'Pending'}
function vDetail(e){
 var h='<p><a href="#events" class="muted">&larr; All tournaments</a></p>'+(done?'<div class="panel" role="status"><b>You are registered.</b> '+esc(done)+' is on the roster. Check this page on game day for pairings.</div>':'')+(mailto?'<div class="panel" role="status"><b>One more step.</b> Registrations are sent to the tournament director by email. <a class="btn" href="'+esc(mailto)+'">Send registration email</a></div>':'')+'<section class="dh"><div class="muted">'+fmt(e.date)+'</div><h1>'+esc(e.name)+'</h1><p class="muted">'+esc(e.venue)+'</p>';
 h+=e.rd.length?'<button class="btn big" disabled>Registration closed</button>':'<button class="btn big" data-showreg="1">Register now</button>';
 h+='</section>'+regForm(e)+'<div class="facts"><div><b>'+e.rounds+'</b><span>Swiss rounds</span></div><div><b>'+e.players.length+'</b><span>players on the roster</span></div><div><b>'+(e.rd.length?'Round '+e.rd.length:'Upcoming')+'</b><span>status</span></div></div>';
 h+='<h2>How it works</h2><p class="muted">Everyone plays every round. Each round you are paired against a player with a similar score, so games stay close. Pairings and standings appear on this page as the day goes on.</p>';
 if(e.rd.length){var r=e.rd[e.rd.length-1];
  h+='<h2>Round '+e.rd.length+' pairings</h2><div class="tw"><table><tr><th>Board</th><th>White</th><th>Black</th><th>Result</th></tr>'+r.map(function(g,i){return'<tr><td>'+(g.b===null?'-':i+1)+'</td><td>'+esc(pname(e,g.w))+'</td><td>'+(g.b===null?'Bye':esc(pname(e,g.b)))+'</td><td>'+rtext(g)+'</td></tr>'}).join('')+'</table></div>';
  h+='<h2>Standings</h2><div class="tw"><table><tr><th>#</th><th>Player</th><th>Rating</th><th>Points</th></tr>'+standings(e).map(function(x,i){return'<tr><td>'+(i+1)+'</td><td>'+esc(x.p.name)+'</td><td>'+(x.p.rtg||'unr')+'</td><td>'+x.pts+'</td></tr>'}).join('')+'</table></div>';for(var ri=e.rd.length-2;ri>=0;ri--){h+='<h3>Round '+(ri+1)+' results</h3><div class="tw"><table><tr><th>Board</th><th>White</th><th>Black</th><th>Result</th></tr>'+e.rd[ri].map(function(g,i){return'<tr><td>'+(g.b===null?'-':i+1)+'</td><td>'+esc(pname(e,g.w))+'</td><td>'+(g.b===null?'Bye':esc(pname(e,g.b)))+'</td><td>'+rtext(g)+'</td></tr>'}).join('')+'</table></div>'}}
 else if(e.players.length){h+='<h2>Players registered</h2><p class="muted">'+e.players.map(function(p){return esc(p.name)}).join(', ')+'</p><p class="muted">Pairings will appear here when round 1 begins.</p>'}
 else{h+='<h2>Pairings</h2><p class="muted">Pairings and standings will appear here once the tournament starts.</p>'}
 return h}
function vManage(){
 var e=cur(),h='<h2>TD console<span class="badge">TD</span></h2>'+(ref&&canWrite?'':'<div class="panel"><b>Not shared.</b> Changes here are saved on this device only. To save for everyone, open this page while signed in to Claude as the page owner.</div>');
 h+='<div class="panel row"><label>Tournament director<input id="tdname" value="'+esc(S.td)+'"></label><label>Tournament<select id="sel">'+S.ev.map(function(x){return'<option value="'+x.id+'"'+(x.id===e.id?' selected':'')+'>'+esc(x.name)+' ('+fmt(x.date)+')</option>'}).join('')+'</select></label></div>';
 
 h+='<h2>Players ('+e.players.length+')</h2><div class="panel">';
 h+='<form id="addp" class="row"><label>Name<input name="n" required autocomplete="off"></label><label>Rating<input name="r" type="number" min="0" max="3000" value="0" style="width:6rem"></label><button class="btn" type="submit"'+(e.rd.length?' disabled':'')+'>Add player</button>'+(e.players.length?'':'<button class="btn ghost" type="button" data-sample="1">Add 8 sample players</button>')+'</form>';
 if(e.players.length){h+='<div class="tw"><table><tr><th>Name</th><th>Rating</th><th>School</th><th>Parent contact</th><th></th></tr>'+e.players.map(function(p){return'<tr><td>'+esc(p.name)+'</td><td>'+(p.rtg||'unr')+'</td><td>'+esc(p.school||'')+'</td><td>'+esc((p.parent||'')+(p.email?' '+p.email:''))+'</td><td>'+(e.rd.length?'':'<button class="btn ghost sm" data-del="'+p.id+'">Remove</button>')+'</td></tr>'}).join('')+'</table></div>'}
 h+='</div>';
 var n=e.rd.length,done=roundDone(e);
 h+='<h2>Pairings</h2><div class="panel row"><span>'+(n?'Round '+n+' of '+e.rounds:'No rounds yet')+'</span>';
 var can=e.players.length>=2&&n<e.rounds&&done;
 h+='<button class="btn" data-gen="1"'+(can?'':' disabled')+'>Pair round '+(n+1)+'</button>';
 if(n&&!done)h+='<span class="muted">Enter every result to pair the next round.</span>';
 if(n&&n>=e.rounds&&done)h+='<span class="muted">All rounds are complete.</span>';
 if(n&&!e.rd[n-1].some(function(g){return g.r&&g.b!==null}))h+='<button class="btn ghost" data-undo="1">Undo round '+n+'</button>';
 h+='</div>';
 for(var ri=e.rd.length-1;ri>=0;ri--){
  h+='<h3>Round '+(ri+1)+'</h3><div class="tw"><table><tr><th>Bd</th><th>White</th><th>Black</th><th>Result</th></tr>';
  e.rd[ri].forEach(function(g,gi){
   h+='<tr><td>'+(g.b===null?'-':gi+1)+'</td><td>'+esc(pname(e,g.w))+'</td><td>'+(g.b===null?'<span class="muted">Bye</span>':esc(pname(e,g.b)))+'</td><td>';
   if(g.b===null)h+='1 point';
   else h+='<select data-ri="'+ri+'" data-gi="'+gi+'" aria-label="Result board '+(gi+1)+'"><option value="">Pending</option><option value="1-0"'+(g.r==='1-0'?' selected':'')+'>1-0</option><option value=".5"'+(g.r==='.5'?' selected':'')+'>½-½</option><option value="0-1"'+(g.r==='0-1'?' selected':'')+'>0-1</option></select>';
   h+='</td></tr>'});
  h+='</table></div>'}
 if(e.players.length){h+='<h2>Standings</h2><div class="tw"><table><tr><th>#</th><th>Player</th><th>Rating</th><th>Points</th><th>Tiebreak</th></tr>'+standings(e).map(function(r,i){return'<tr><td>'+(i+1)+'</td><td>'+esc(r.p.name)+'</td><td>'+(r.p.rtg||'unr')+'</td><td>'+r.pts+'</td><td>'+r.bu+'</td></tr>'}).join('')+'</table></div>'}
 h+='<h2>Create a tournament</h2><form id="newev" class="panel row"><label>Name<input name="n" required></label><label>Date<input name="d" type="date" required></label><label>Location<input name="v" required></label><label>Rounds<input name="k" type="number" min="1" max="9" value="4" style="width:5rem"></label><button class="btn" type="submit">Create</button></form>';
 return h}

function render(){
 var m=location.hash==='#manage';
 var lg=location.hash==='#login',td=isTD();$('#nav').innerHTML='<a href="#events" class="'+(m||lg?'':'on')+'">Tournaments</a>'+(td?'<a href="#manage" class="'+(m?'on':'')+'">TD console</a>':'')+(S.user?'<button class="lk" data-logout="1">Log out</button>':'<a href="#login" class="'+(lg?'on':'')+'">Log in</a>');
 var d=/^#e-/.test(location.hash)?ev(location.hash.slice(3)):null;$('#app').innerHTML=m?(td?vManage():vLocked()):lg?vLogin():d?vDetail(d):vEvents()}

/* events */
var regId=null,done=null;
function addPlayer(e,n,r){e.players.push({id:uid(),name:n.trim(),rtg:Math.max(0,parseInt(r,10)||0)})}
document.addEventListener('click',function(x){
 var t=x.target.closest('button');if(!t)return;var e=cur();
 if(t.dataset.reg){var ee=ev(t.dataset.reg);if(ee.rd.length){toast('Registration is closed. Pairings have started.');return}regId=ee.id;$('#regt').textContent='Register for '+ee.name;$('#reg').showModal();return}
 if(t.dataset.resetpw){S.pw=null;save();render();toast('Password cleared. Enter a new password (8 or more characters) to set it.');return}
 if(t.dataset.logout){S.user=null;save();location.hash='#events';render();toast('Logged out');return}
 if(t.dataset.showreg){var bx=$('#regbox');if(bx){bx.hidden=false;bx.scrollIntoView({behavior:'smooth',block:'center'});var fi=bx.querySelector('input');if(fi)fi.focus({preventScroll:true})}return}
 if(t.dataset.hidereg){$('#regbox').hidden=true;return}
 if(t.dataset.mng){S.cur=t.dataset.mng;save();location.hash='#manage';render();return}
 if(t.dataset.sample){['Enroquero, S.|1971','Fianchetti, M.|1864','Alfilar, A.|2117','Tablerino, J.|1830','Peonez, R.|1420','Torres, L.|1305','Gambito, D.|1150','Casilla, E.|0'].forEach(function(s){var a=s.split('|');addPlayer(e,a[0],a[1])});save();render();return}
 if(t.dataset.del){e.players=e.players.filter(function(p){return p.id!==t.dataset.del});save();render();return}
 if(t.dataset.gen){pairRound(e);save();render();toast('Round '+e.rd.length+' paired');return}
 if(t.dataset.undo){e.rd.pop();save();render();return}
 if(t.id==='regx'){$('#reg').close()}});
document.addEventListener('change',function(x){
 var t=x.target;
 if(t.id==='sel'){S.cur=t.value;save();render()}
 else if(t.id==='tdname'){S.td=t.value||'Tournament Director';save()}
 else if(t.id==='formurl'){var u=t.value.trim();if(u&&!/^https?:\/\//.test(u)){toast('The link must start with https://');t.value='';u=''}cur().form=u;save();toast(u?'Registration link saved':'Registration link cleared')}
 else if(t.dataset&&t.dataset.ri!==undefined){cur().rd[+t.dataset.ri][+t.dataset.gi].r=t.value;save();render()}});
document.addEventListener('submit',function(x){
 var f=x.target;
 if(f.id==='regf'){x.preventDefault();var e=ev(regId);addPlayer(e,f.n.value,f.r.value);save();f.reset();$('#reg').close();toast('Registered. '+e.players.length+' players now in this event.');render()}
 else if(f.id==='loginf'){x.preventDefault();var em=f.e.value.trim().toLowerCase(),pw=f.p.value;if(em!==TD){S.user=em;save();location.hash='#events';render();toast('Logged in');return}if(!S.pw){if(pw.length<8){toast('Choose a password with at least 8 characters.');return}hashPw(pw).then(function(h){S.pw=h;S.user=em;save();location.hash='#manage';render()})}else{hashPw(pw).then(function(h){if(h===S.pw){S.user=em;save();location.hash='#manage';render()}else{toast('Wrong password.')}})}}
 else if(f.id==='regf2'){x.preventDefault();var e2=ev(f.dataset.ev);if(e2.rd.length){toast('Registration is closed.');return}var nm=f.n.value.trim();if(!(ref&&canWrite)){var bd=['Player: '+nm,'Rating: '+f.r.value,'Grade: '+f.g.value,'School or club: '+f.s.value,'Parent or guardian: '+f.p.value,'Email: '+f.m.value,'Phone: '+f.t.value].join('\n');mailto='mailto:'+TD+'?subject='+encodeURIComponent('Registration: '+e2.name)+'&body='+encodeURIComponent(bd);done=null;render();window.scrollTo(0,0);return}if(e2.players.some(function(p){return p.name.toLowerCase()===nm.toLowerCase()})){toast('That player is already registered.');return}e2.players.push({id:uid(),name:nm,rtg:Math.max(0,parseInt(f.r.value,10)||0),grade:f.g.value.trim(),school:f.s.value.trim(),parent:f.p.value.trim(),email:f.m.value.trim(),phone:f.t.value.trim()});save();done=nm;render();window.scrollTo(0,0)}
 else if(f.id==='addp'){x.preventDefault();addPlayer(cur(),f.n.value,f.r.value);save();render()}
 else if(f.id==='newev'){x.preventDefault();var id=uid();S.ev.push({id:id,name:f.n.value.trim(),date:f.d.value,venue:f.v.value.trim(),rounds:Math.min(9,Math.max(1,+f.k.value||4)),players:[],rd:[]});S.cur=id;save();render();toast('Tournament created')}});
window.addEventListener('hashchange',function(){done=null;mailto=null;render();window.scrollTo(0,0)});
syncDb();
render();
})();
</script>
</body>
</html>
